name: Publish gesso-mcp

# Runs when a change to the package (usually a version bump) lands on main,
# when a gesso-mcp-v* tag is pushed, or by hand from the Actions tab. Versions
# already on npm are skipped, so merges that don't bump the version do nothing.
# It signs in to npm with Trusted Publishing (this workflow's GitHub identity, set
# up once on npmjs.com under the package's Settings › Trusted publishing), so no
# token can expire. Without that, it falls back to an npm token in NPM_TOKEN.
on:
  push:
    branches: [main]
    paths: ["packages/gesso-mcp/package.json", ".github/workflows/publish.yml"]
    tags: ["gesso-mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance and Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node packages/gesso-mcp/build.mjs
      - name: Skip if this version is already on npm
        id: check
        working-directory: packages/gesso-mcp
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "gesso-mcp@$version" version >/dev/null 2>&1; then
            echo "gesso-mcp@$version is already published"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - name: Use npm 11
        if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@11.6.2
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/gesso-mcp
        # Provenance links the npm package to the commit and workflow that built it.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Lists the new version in the official MCP Registry (registry.modelcontextprotocol.io), which VS Code,
  # GitHub and other directories read. It signs in with this workflow's GitHub identity, so there's no secret;
  # the registry checks that the npm package's mcpName matches server.json's name.
  registry:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for the version to reach npm
        run: |
          version=$(node -p "require('./packages/gesso-mcp/package.json').version")
          for i in $(seq 1 30); do
            npm view "gesso-mcp@$version" mcpName 2>/dev/null | grep -q . && exit 0
            sleep 20
          done
          echo "gesso-mcp@$version isn't on npm yet"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  # Attaches the Claude Desktop extension to a GitHub release for each version, as gesso-<version>.mcpb
  # and gesso.mcpb, so releases/latest/download/gesso.mcpb always points at the newest one. The notes
  # come from the version's section in CHANGELOG.md. Versions that already have a release are skipped.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.check.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Skip if this version already has a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/gesso-mcp/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "gesso-mcp-v$version" >/dev/null 2>&1; then
            echo "gesso-mcp-v$version is already released"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the extension
        if: steps.check.outputs.skip != 'true'
        run: node packages/gesso-mcp/build.mjs && node packages/gesso-mcp/build-mcpb.mjs
      - name: Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          cp "packages/gesso-mcp/gesso-$VERSION.mcpb" packages/gesso-mcp/gesso.mcpb
          awk -v v="$VERSION" 'index($0, "## " v) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Gesso $VERSION" > notes.md
          gh release create "gesso-mcp-v$VERSION" "packages/gesso-mcp/gesso-$VERSION.mcpb" packages/gesso-mcp/gesso.mcpb \
            --title "Gesso $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  # A new version also goes out to the hosted server (when a FLY_API_TOKEN secret is set).
  deploy:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
